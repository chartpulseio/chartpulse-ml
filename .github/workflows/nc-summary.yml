name: Next-candle summary
on:
  workflow_dispatch:
    inputs:
      run: { description: "backtest run id", required: true }
      exclude: { description: "models to leave out", default: "" }
permissions: { contents: read, actions: read }
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art, run-id: "${{ inputs.run }}", github-token: "${{ github.token }}", pattern: "rows-*" }
      - env: { NC_EXCLUDE: "${{ inputs.exclude }}" }
        run: pip install pandas numpy && python nc/summary.py | tee -a $GITHUB_STEP_SUMMARY
